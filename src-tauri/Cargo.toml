[package]
name = "whisperdesk"
version = "1.0.0"
description = "WhisperDesk - Offline Audio Transcription"
authors = ["WhisperDesk"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-sidecar", "dialog-all", "fs-all", "path-all", "process-all", "shell-open", "shell-execute", "window-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
